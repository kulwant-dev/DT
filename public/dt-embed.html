<!--
  Test
  Dreamteam — Interactive Product Showcase (click-through)
  ==========================================================
  Self-contained Webflow embed. No external script hosting required.
  Drop this whole block into a Webflow "Embed" element.

  What's inside:
    1. Google Fonts preconnect + Fraunces / Inter stylesheets (the showcase
       relies on these typefaces; everything else — colors, Tailwind utilities,
       images — is already inlined into the JS bundle below).
    2. The <div id="dreamteam-showcase"> mount point. The bundle looks for this
       exact id; do not rename it. You can wrap it in any Webflow section.
    3. The full IIFE bundle (React + showcase component + inlined CSS + base64
       images). It self-mounts on DOMContentLoaded and is idempotent — if the
       script runs twice it will not double-mount.

  To constrain height, wrap the mount div in a Webflow container with a fixed
  height + overflow:auto. Otherwise it grows to fit its content.
-->

s + integrations + support, not headline per-seat",feedback:"Strong total-cost framing — adding a specific dollar number makes this even tighter."},{prompt:'"We need to see ROI within 6 months"',sample:"Median ROI for teams your size lands at month 4. I can pull a customer at the same headcount who closed payback in 5 months and walk you through the math.",strategy:"Anchor on people-ops time savings with a customer-similar number",feedback:"Confident, specific, and offers proof — this is the right move."},{prompt:'"Can you match our current per-seat?"',sample:"Per-seat match isn't usually how we win — but let me show you what's bundled into our plan that's an add-on with Workday (reporting, onboarding flows, integrations). Most teams find it nets out better.",strategy:"Reframe parity asks around what's bundled vs. add-on",feedback:"Excellent reframe — keep this in your back pocket for every parity ask."}]},{key:"technical",title:"Technical Feature Questions",difficulty:"Hard",minutes:20,practiceObjections:['"Does Tandem integrate with our existing payroll?"','"How does your reporting compare to Workday?"','"What happens if your service goes down?"'],keyStrategies:["Show — don't tell — with a screenshare or short Loom","Quantify reporting time-savings instead of feature listing","Lead with reliability numbers, not aspirational copy"],session:[{prompt:'"Does Tandem integrate with our existing payroll?"',sample:"Yes — and rather than listing connectors, let me share my screen and pull yours up live. Takes 90 seconds.",strategy:"Show — don't tell — with a screenshare or short Loom",feedback:"Good — concrete, low-friction next step. Visitors trust the demo over a slide."},{prompt:'"How does your reporting compare to Workday?"',sample:"Teams your size build reports ~40% faster with us vs. Workday — happy to share the dashboard build inventory of three similar customers.",strategy:"Quantify reporting time-savings instead of feature listing",feedback:"Specific. Numbers beat nths and walk you through the math.",strategy:"Anchor on time savings with a customer-specific number",feedback:"Confident, specific, and offers proof — this is the right move."},{prompt:`"Can you match our current vendor's pricing?"`,sample:"Pricing match isn't usually how we win — but let me show you what's bundled into our plan that's a paid add-on with ConnectWise. Most folks find it's a wash or better.",strategy:"Reframe parity asks around what's bundled vs. paid add-on",feedback:"Excellent reframe — keep this in your back pocket for every parity ask."}]},{key:"technical",title:"Technical Feature Questions",difficulty:"Hard",minutes:20,practiceObjections:['"Does SuperOps integrate with our existing PSA?"','"How does your automation compare to ConnectWise?"','"What happens if your service goes down?"'],keyStrategies:["Show — don't tell — with a screenshare or short Loom","Quantify automation savings instead of feature listing","Lead with reliability numbers, not aspirational copy"],session:[{prompt:'"Does SuperOps integrate with our existing PSA?"',sample:"Yes — and rather than listing connectors, let me share my screen and pull yours up live. Takes 90 seconds.",strategy:"Show — don't tell — with a screenshare or short Loom",feedback:"Good — concrete, low-friction next step. Visitors trust the demo over a slide."},{prompt:'"How does your automation compare to ConnectWise?"',sample:"Customers your size automate ~14 hrs/week with us vs. 6 with ConnectWise — happy to share the workflow inventory of three similar accounts.",strategy:"Quantify automation savings instead of feature listing",feedback:"Specific. Numbers beat adjectives every time."},{prompt:'"What happens if your service goes down?"',sample:"99.97% uptime over the last 12 months. We publish a status page, and our SLA covers credit on anything below 99.9%.",strategy:"Lead with reliability numbers, not aspirational copy",feedback:"Strong — specific number + accountability mechanism."}]},{key:"timeline",title:"Timeline & Implementation",difficulty:"Easy",minutes:10,practiceObjections:[`"How long until we're fully migrated?"`,`"What if your team doesn't hit the timeline?"`,'"Who owns implementation on our side?"'],keyStrategies:["Give a phased timeline, not a single date","Tie commitment to milestones, not days","Define mutual responsibility upfront"],session:[{prompt:`"How long until we're fully migrated?"`,sample:"Phased rollout: data import in week 1, parallel run weeks 2–3, full cutover week 4. Most teams your size hit full cutover by day 28.",strategy:"Give a phased timeline, not a single date",feedback:"Clean — phasing builds confidence vs. a vague 'a month'."},{prompt:`"What if your team doesn't hit the timeline?"`,sample:"Implementation is milestone-based — if we miss the parallel-run gate, you don't pay for the next phase until we clear it.",strategy:"Tie commitment to milestones, not days",feedback:"Excellent — converts a fear into a contractual answer."},{prompt:'"Who owns implementation on our side?"',sample:"Lightweight — one project lead from your team, ~2 hrs/week for 4 weeks. Implementation lead from our side does the heavy lifting.",strategy:"Define mutual responsibility upfront",feedback:"Right level of commitment ask. Sets up a clean kickoff."}]}]},contactDetail:{heading:"Nathan, here's what your team needs you on",contact:{name:"Iris Bellweather",initials:"IB",role:"CTO · Hearthwell",company:"Hearthwell",email:"iris@hearthwell.com",phone:"(415) 555-0142",badges:[{label:"Decision Maker",tone:"violet"},{label:"Champion",tone:"green"}]},properties:{owner:"Nathan Drake",lastInteraction:"Reply sent · 3 min ago",product:"SuperOps PSA",lifecycleStage:"Opportunity Created",contactSource:"Inbound · G2 RFP"},tasks:[{key:"callprep",type:"Call Prep",title:"Prep for Hearthwell pricing walkthrough",body:"Practice handling Iris's pricing pushback before Monday's call. Roleplay the ConnectWise comparison and the volume-discount ask.",dueLabel:"Apr 27 · Mon 10:00 A
